# Install scripts are blocked by default (pnpm 12). Only these may run:
allowBuilds:
  "@prisma/engines": true # downloads the Prisma schema/migration engine
  prisma: true # Prisma CLI postinstall
  esbuild: true # native binary used by tsx and Vitest
  sharp: false # prebuilt binaries come from optional deps
  unrs-resolver: false # prebuilt binaries come from optional deps
